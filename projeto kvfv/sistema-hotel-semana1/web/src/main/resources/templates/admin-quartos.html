<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Gerenciar quartos')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page"><div class="page-heading"><div><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Quartos</h1><p class="muted">Cadastre os quartos reais do hotel e mantenha tipo, diária e situação atualizados.</p></div></div>
<p class="notice success" th:if="${sucesso}" th:text="${sucesso}"></p><p class="notice error" th:if="${erro}" th:text="${erro}"></p><div class="columns"><section class="panel"><h2 th:text="${id != null ? 'Editar quarto' : 'Novo quarto'}">Novo quarto</h2>
<form th:action="@{/admin/quartos/salvar}" th:object="${form}" method="post" class="stack"><input type="hidden" name="id" th:value="${id}"><label>Número<input th:field="*{numero}" required></label><label>Tipo<select th:field="*{tipo}" required><option value="">Selecione</option><option value="SOLTEIRO">Solteiro</option><option value="CASAL">Casal</option><option value="FAMILIA">Família</option><option value="SUITE">Suíte</option></select></label><label>Situação<select th:field="*{status}" required><option value="">Selecione</option><option value="DISPONIVEL">Disponível</option><option value="OCUPADO">Ocupado</option><option value="MANUTENCAO">Em manutenção</option></select></label><label>Valor da diária (R$)<input th:field="*{valorDiaria}" type="number" min="0.01" step="0.01" required></label><label>Capacidade de hóspedes<input th:field="*{capacidade}" type="number" min="1" step="1" required></label><label>Descrição<textarea th:field="*{descricao}" rows="3"></textarea></label><button class="button primary" th:text="${id != null ? 'Salvar alterações' : 'Cadastrar quarto'}">Cadastrar quarto</button><a class="button secondary centered" th:if="${id != null}" th:href="@{/admin/quartos}">Cancelar edição</a></form></section>
<section class="panel"><h2>Quartos cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Número</th><th>Tipo</th><th>Diária</th><th>Situação</th><th>Ações</th></tr></thead><tbody><tr th:each="q : ${quartos}"><td th:text="${q.numero}"></td><td th:text="${q.tipo}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(q.valorDiaria,1,2)}"></td><td th:text="${q.status}"></td><td class="actions"><a class="action-link" th:href="@{/admin/quartos/{id}/editar(id=${q.id})}">Editar</a><form th:action="@{/admin/quartos/{id}/excluir(id=${q.id})}" method="post" onsubmit="return confirm('Excluir este quarto?')"><button class="action-link danger-link">Excluir</button></form></td></tr><tr th:if="${quartos.isEmpty()}"><td class="empty" colspan="5">Nenhum quarto cadastrado.</td></tr></tbody></table></div></section></div></main></body></html>
