<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Funcionários')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page"><div class="page-heading"><div><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Funcionários</h1><p class="muted">Crie e mantenha acessos da equipe de recepção.</p></div></div><p class="notice success" th:if="${sucesso}" th:text="${sucesso}"></p><p class="notice error" th:if="${erro}" th:text="${erro}"></p>
<div class="columns"><section class="panel"><h2 th:text="${id != null ? 'Editar funcionário' : 'Novo funcionário'}">Novo funcionário</h2><form th:action="${id != null ? '/admin/funcionarios/alterar' : '/admin/funcionarios'}" th:object="${form}" method="post" class="stack"><input type="hidden" th:field="*{id}"><label>Nome completo<input th:field="*{nome}" required><small class="field-error" th:errors="*{nome}"></small></label><label>E-mail de acesso<input th:field="*{login}" type="email" required><small class="field-error" th:errors="*{login}"></small></label><label><span th:text="${id != null ? 'Nova senha (opcional)' : 'Senha inicial'}">Senha inicial</span><input th:field="*{senha}" type="password" th:required="${id == null}"><small class="field-error" th:errors="*{senha}"></small></label><p class="muted" th:if="${id != null}">Deixe a senha em branco para manter a senha atual.</p><button class="button primary" th:text="${id != null ? 'Salvar alterações' : 'Criar acesso'}">Criar acesso</button><a class="button secondary centered" th:if="${id != null}" th:href="@{/admin/funcionarios}">Cancelar edição</a></form></section>
<section class="panel"><h2>Equipe cadastrada</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail de acesso</th><th>Ações</th></tr></thead><tbody><tr th:each="f : ${funcionarios}"><td th:text="${f.nome}"></td><td th:text="${f.login}"></td><td class="actions"><a class="action-link" th:href="@{/admin/funcionarios/{id}/editar(id=${f.id})}">Editar</a><form th:action="@{/admin/funcionarios/{id}/excluir(id=${f.id})}" method="post" onsubmit="return confirm('Excluir este acesso de funcionário?')"><button class="action-link danger-link">Excluir</button></form></td></tr><tr th:if="${funcionarios.isEmpty()}"><td class="empty" colspan="3">Nenhum funcionário cadastrado.</td></tr></tbody></table></div></section></div></main></body></html>
