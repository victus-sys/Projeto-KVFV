<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Minha conta')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page narrow"><p class="eyebrow">ÁREA DO HÓSPEDE</p><h1>Minha conta</h1><p class="muted">Mantenha seus dados e sua senha atualizados.</p><p class="notice success" th:if="${sucesso}" th:text="${sucesso}"></p><p class="notice error" th:if="${erro}" th:text="${erro}"></p>
<div th:if="${hospede != null}" class="columns account-columns"><section class="panel"><h2>Dados pessoais</h2><form th:action="@{/minha-conta/dados}" th:object="${dadosForm}" method="post" class="stack"><label>Nome completo<input th:field="*{nome}" required></label><label>E-mail de acesso<input th:field="*{login}" type="email" required></label><label>Documento<input th:field="*{documento}"></label><label>Telefone<input th:field="*{telefone}"></label><button class="button primary">Salvar dados</button></form></section>
<section class="panel"><h2>Alterar senha</h2><form th:action="@{/minha-conta/senha}" th:object="${senhaForm}" method="post" class="stack"><label>Senha atual<input th:field="*{atual}" type="password" autocomplete="current-password" required></label><label>Nova senha<input th:field="*{nova}" type="password" autocomplete="new-password" minlength="6" required></label><label>Confirmar nova senha<input th:field="*{confirmacao}" type="password" autocomplete="new-password" minlength="6" required></label><button class="button secondary">Alterar senha</button></form></section></div>
<section class="panel" th:if="${hospede == null}"><p>Não encontramos um cadastro de hóspede associado a esta conta.</p></section></main></body></html>
