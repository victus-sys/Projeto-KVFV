<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Reserva')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page narrow"><a class="back-link" th:href="${souHospede ? '/minhas-reservas' : '/reservas'}">← Voltar às reservas</a><p class="eyebrow">HOTEL ALBA</p><h1 th:text="${modoEdicao ? 'Alterar reserva' : 'Nova reserva'}">Nova reserva</h1><p class="muted">Escolha o período e um quarto que esteja livre. A saída deve ser depois da entrada.</p>
<p class="notice error" th:if="${erro}" th:text="${erro}"></p><section class="panel"><form th:action="@{/reservas/salvar}" th:object="${form}" method="post" class="stack">
<input type="hidden" th:field="*{reservaId}"><label th:unless="${souHospede}">Hóspede<select th:field="*{hospedeId}" required><option value="">Selecione o hóspede</option><option th:each="h : ${hospedes}" th:value="${h.id}" th:text="${h.nome}"></option></select></label>
<label>Data de entrada<input type="date" th:field="*{entrada}" required></label><label>Data de saída<input type="date" th:field="*{saida}" required></label><label>Quarto disponível<select th:field="*{quartoId}" required><option value="">Selecione um quarto</option><option th:each="q : ${quartos}" th:if="${q.disponivel or q.id == form.quartoId}" th:value="${q.id}" th:text="${'Quarto ' + q.numero + ' · ' + q.tipo + ' · R$ ' + #numbers.formatDecimal(q.valorDiaria,1,2) + (q.disponivel ? '' : ' · atual da reserva')}"></option></select></label>
<button class="button primary" type="submit" th:text="${modoEdicao ? 'Salvar alterações' : 'Confirmar reserva'}">Confirmar reserva</button></form></section></main></body></html>
