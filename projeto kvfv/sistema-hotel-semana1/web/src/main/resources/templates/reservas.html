<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Reservas')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page"><div class="page-heading"><div><p class="eyebrow" th:text="${isHospede ? 'ÁREA DO HÓSPEDE' : 'OPERAÇÃO'}">RESERVAS</p><h1 th:text="${isHospede ? 'Minhas reservas' : 'Reservas'}">Reservas</h1><p class="muted">Acompanhe o período e a situação da hospedagem.</p></div><a class="button primary" th:href="@{/quartos}">Ver quartos disponíveis</a></div>
<p class="notice success" th:if="${sucesso}" th:text="${sucesso}"></p><p class="notice error" th:if="${erro}" th:text="${erro}"></p><form sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')" th:action="@{/reservas/canceladas/excluir}" method="post" class="panel" onsubmit="return confirm('Apagar definitivamente todas as reservas canceladas?')"><button class="button secondary" type="submit">Apagar reservas canceladas</button></form><section class="panel"><div class="table-wrap"><table><thead><tr><th th:unless="${isHospede}">Hóspede</th><th>Quarto</th><th>Entrada</th><th>Saída</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="r : ${reservas}"><td th:unless="${isHospede}" th:text="${r.hospede}"></td><td th:text="${r.quarto}"></td><td th:text="${#temporals.format(r.entrada,'dd/MM/yyyy')}"></td><td th:text="${#temporals.format(r.saida,'dd/MM/yyyy')}"></td><td><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(r.status)}" th:text="${r.status}"></span></td><td class="actions"><a th:if="${r.status == 'PENDENTE' or r.status == 'CONFIRMADA'}" class="action-link" th:href="@{/reservas/{id}/editar(id=${r.id})}">Alterar</a><form th:if="${r.status == 'PENDENTE' or r.status == 'CONFIRMADA'}" th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post" onsubmit="return confirm('Cancelar esta reserva?')"><button class="action-link danger-link">Cancelar</button></form><form sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')" th:if="${r.status == 'PENDENTE'}" th:action="@{/reservas/{id}/confirmar(id=${r.id})}" method="post"><button class="action-link">Confirmar</button></form><form sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')" th:if="${r.status == 'CONFIRMADA'}" th:action="@{/reservas/{id}/checkin(id=${r.id})}" method="post"><button class="action-link">Check-in</button></form><form sec:authorize="hasAnyRole('ADMIN','RECEPCIONISTA')" th:if="${r.status == 'EM_HOSPEDAGEM'}" th:action="@{/reservas/{id}/checkout(id=${r.id})}" method="post"><button class="action-link">Check-out</button></form></td></tr><tr th:if="${reservas.isEmpty()}"><td class="empty" colspan="6">Ainda não há reservas.</td></tr></tbody></table></div></section></main></body></html>
